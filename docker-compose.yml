# Full local stack: Postgres, the ingest service and the demo traffic app.
# Copy .env.example to .env to override the defaults.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=codepulse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-codepulse}
      - POSTGRES_DB=codepulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepulse"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: codepulse-ingest/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://codepulse:${POSTGRES_PASSWORD:-codepulse}@postgres:5432/codepulse
      - DATABASE_SSL=false
      - INGEST_API_KEY=${INGEST_API_KEY:-local-dev-key}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DEMO_PROJECT_ID=demo-project
      - DEMO_REPO=Ramya-Shah/CodePulse
      - DEMO_PATH_PREFIX=demo/
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # The AI analysis reads the demo's source from this read-only mount.
      - DEMO_SOURCE_ROOT=/src
    volumes:
      - ./demo:/src/demo:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    environment:
      - INGEST_URL=http://ingest:3000/ingest
      - API_KEY=${INGEST_API_KEY:-local-dev-key}
      - REQUESTS_PER_SECOND=${DEMO_REQUESTS_PER_SECOND:-40}
    depends_on:
      - ingest
    restart: unless-stopped

volumes:
  postgres_data:
